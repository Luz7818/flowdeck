name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # workspace npm can hold back esbuild's postinstall (AGENTS.md 已知坑);
      # rebuilding it explicitly is a no-op when the binary is already in place
      - run: npm rebuild esbuild
      - run: npm run build
      - run: npm run test:e2e
