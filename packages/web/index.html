<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%232563eb'/%3E%3Crect x='18' y='2' width='12' height='12' rx='3' fill='%23a855f7'/%3E%3Crect x='2' y='18' width='12' height='12' rx='3' fill='%2310b981'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%23f59e0b'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlowDeck — visualize the plan-confirmation step of AI IDE conversations as an editable modular canvas." />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>FlowDeck</title>
    <script>
      // set the dark class before first paint (no flash); ThemeToggle keeps it in sync afterwards
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('flowdeck.theme'); } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // dev diagnostic: surface fatal boot errors in the tab title
      window.addEventListener('error', function (e) {
        document.title = 'ERR: ' + (e.message || e.error); fetch('/__err', { method: 'POST', body: String(e.error && e.error.stack || e.error || e.message) }).catch(function(){});
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
